- name: Configure RHEL application server
  hosts: Frontend
  become: yes

  tasks:

  #Install Nginx Package
  - name: Install Nginx
    ansible.builtin.dnf:
      name: nginx
      state: present

  #Create application system user
  - name: Create webapp user
    ansible.builtin.user:
      name: webapp
      state: present
      shell: /sbin/nologin

  #Create application directory
  - name: Create application directory
    ansible.builtin.file:
      path: /app
      state: directory
      owner: webapp
      group: webapp
      mode: '0755'

  #start nginx and enable it at boot
  - name: start and enable nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes