- name: variables in ansible demo
  hosts: local
  connection: local

  #declaring Play level variables
  vars:
    course: Ansible
    trainer: Huzaifa Shaik
    duration: 10hrs

  tasks:
  - name: Accesing play level variables
    debug:
      # Accessing variables with jinja2 syntax {{ var }}
      msg: "Hi, Welcome to {{ course }} course by {{ trainer }}, duration of {{ duration }}"