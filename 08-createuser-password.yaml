- name: playbook to create user and update password
  hosts: Frontend
  become: yes

  vars_file:
    - vault.yml

  tasks:

  - name: Create user and update password
    user:
      name: shaikmd
      state: present
      shell: /bin/bash
      create_home: true
      groups: sudo
      append: true
      # Hash the password using SHA-512
      password: "{{ new_password | password_hash('sha512') }}"
      # Options: 'always' (updates every time it differs) or 'on_create' (only sets for new users)
      update_password: always
